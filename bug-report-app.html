<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bug Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C1E21;
    --ink-soft:#2A2D31;
    --paper:#F7F5F0;
    --paper-dim:#EDEAE2;
    --amber:#E8A23D;
    --amber-dim:#3A3120;
    --green:#4A7C59;
    --green-dim:#1F2E23;
    --red:#C1443C;
    --red-dim:#3A1F1D;
    --line:rgba(255,255,255,0.09);
    --line-soft:rgba(28,30,33,0.1);
    --text-dim:#9A9994;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--ink);
    color:var(--paper);
    min-height:100vh;
  }
  .app{max-width:1100px; margin:0 auto; padding:40px 24px 80px;}

  /* ---- Header / nav ---- */
  .topbar{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:36px; flex-wrap:wrap; gap:16px;
  }
  .brand{display:flex; align-items:baseline; gap:12px;}
  .brand-mark{
    font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:600;
    color:var(--ink); background:var(--amber); padding:3px 8px; border-radius:3px;
    letter-spacing:0.06em;
  }
  .brand h1{font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; letter-spacing:-0.01em;}
  .nav-tabs{display:flex; gap:4px; background:var(--ink-soft); padding:4px; border-radius:10px; border:1px solid var(--line);}
  .nav-tab{
    font-family:'Inter',sans-serif; font-size:13.5px; font-weight:600; color:var(--text-dim);
    background:none; border:none; padding:8px 16px; border-radius:7px; cursor:pointer;
    transition:all .15s ease;
  }
  .nav-tab.active{background:var(--paper); color:var(--ink);}
  .nav-tab:not(.active):hover{color:var(--paper);}

  /* ---- Views ---- */
  .view{display:none;}
  .view.active{display:block; animation:fadeIn .3s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  /* ================= FORM VIEW ================= */
  .form-wrap{max-width:620px; margin:0 auto;}
  .form-intro{margin-bottom:32px;}
  .form-intro .eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--amber);
    letter-spacing:0.1em; text-transform:uppercase; display:block; margin-bottom:10px;
  }
  .form-intro h2{font-family:'Space Grotesk',sans-serif; font-size:30px; font-weight:700; margin-bottom:10px; letter-spacing:-0.01em;}
  .form-intro p{color:var(--text-dim); font-size:14.5px; line-height:1.6; max-width:520px;}

  .card{
    background:var(--paper); color:var(--ink); border-radius:16px;
    padding:36px; box-shadow:0 20px 60px rgba(0,0,0,0.35);
  }
  .field{margin-bottom:22px;}
  .field:last-child{margin-bottom:0;}
  .field label{
    display:block; font-size:12.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.05em; color:var(--ink); margin-bottom:7px;
  }
  .field .hint{font-size:12.5px; color:#6b6a66; font-weight:400; text-transform:none; letter-spacing:0; display:block; margin-top:4px;}
  .field input[type=text], .field input[type=email], .field textarea, .field select{
    width:100%; font-family:'Inter',sans-serif; font-size:14.5px; color:var(--ink);
    background:#fff; border:1.5px solid var(--line-soft); border-radius:9px;
    padding:11px 13px; outline:none; transition:border-color .15s ease;
  }
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--ink);}
  .field textarea{resize:vertical; min-height:70px; line-height:1.5; font-family:'Inter',sans-serif;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}

  .severity-picker{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .sev-btn{
    font-family:'Inter',sans-serif; font-size:13px; font-weight:600; padding:10px 6px;
    border-radius:8px; border:1.5px solid var(--line-soft); background:#fff; color:var(--ink);
    cursor:pointer; transition:all .15s ease; text-align:center;
  }
  .sev-btn[data-sev="Low"].selected{background:#4A7C59; border-color:#4A7C59; color:#fff;}
  .sev-btn[data-sev="Medium"].selected{background:var(--amber); border-color:var(--amber); color:#1C1E21;}
  .sev-btn[data-sev="High"].selected{background:#D9772F; border-color:#D9772F; color:#fff;}
  .sev-btn[data-sev="Critical"].selected{background:var(--red); border-color:var(--red); color:#fff;}

  select{appearance:none; -webkit-appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23666'/></svg>"); background-repeat:no-repeat; background-position:right 14px center; padding-right:34px;}

  .submit-btn{
    width:100%; margin-top:28px; font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:700;
    background:var(--ink); color:var(--paper); border:none; border-radius:10px; padding:15px;
    cursor:pointer; transition:transform .12s ease, background .15s ease;
  }
  .submit-btn:hover{background:#000; transform:translateY(-1px);}
  .submit-btn:active{transform:translateY(0);}
  .submit-btn:disabled{opacity:0.6; cursor:not-allowed; transform:none;}

  .success-card{
    background:var(--paper); color:var(--ink); border-radius:16px; padding:48px 36px;
    text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.35);
  }
  .success-stamp{
    display:inline-block; font-family:'JetBrains Mono',monospace; font-weight:600; font-size:13px;
    background:var(--ink); color:var(--paper); padding:6px 14px; border-radius:6px;
    transform:rotate(-2deg); margin-bottom:20px; letter-spacing:0.04em;
  }
  .success-card h3{font-family:'Space Grotesk',sans-serif; font-size:22px; margin-bottom:10px;}
  .success-card p{color:#6b6a66; font-size:14px; margin-bottom:24px;}
  .success-card button{
    font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px; background:none;
    border:1.5px solid var(--ink); color:var(--ink); padding:10px 20px; border-radius:8px; cursor:pointer;
  }
  .success-card button:hover{background:var(--ink); color:var(--paper);}

  /* ================= BOARD VIEW ================= */
  .board-header{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:24px; flex-wrap:wrap; gap:14px;}
  .board-header h2{font-family:'Space Grotesk',sans-serif; font-size:24px; font-weight:700;}
  .board-stats{display:flex; gap:10px; flex-wrap:wrap;}
  .stat-chip{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:600;
    background:var(--ink-soft); border:1px solid var(--line); padding:6px 11px; border-radius:20px; color:var(--text-dim);
  }
  .stat-chip b{color:var(--paper);}

  .filter-row{display:flex; gap:8px; margin-bottom:22px; flex-wrap:wrap;}
  .filter-chip{
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600; color:var(--text-dim);
    background:var(--ink-soft); border:1px solid var(--line); padding:7px 14px; border-radius:20px; cursor:pointer;
    transition:all .15s ease;
  }
  .filter-chip.active{background:var(--paper); color:var(--ink); border-color:var(--paper);}

  .board-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:16px;
  }
  .ticket{
    background:var(--paper); color:var(--ink); border-radius:13px; padding:20px;
    position:relative; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,0.25);
  }
  .ticket-id{
    font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; color:#8a8983;
    letter-spacing:0.04em; margin-bottom:8px; display:block;
  }
  .ticket h4{font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:700; margin-bottom:8px; line-height:1.3;}
  .ticket .desc{font-size:13px; color:#57564f; line-height:1.5; margin-bottom:14px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;}
  .ticket-tags{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .tag{
    font-family:'Inter',sans-serif; font-size:10.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.04em; padding:4px 9px; border-radius:5px;
  }
  .tag-sev-Low{background:#E4EFE6; color:#2F5B3C;}
  .tag-sev-Medium{background:#FCEACB; color:#8A5A17;}
  .tag-sev-High{background:#FBE1CD; color:#A4460F;}
  .tag-sev-Critical{background:#F7D9D6; color:#8F2A23;}
  .tag-area{background:#EDEAE2; color:#57564f;}
  .ticket-footer{display:flex; justify-content:space-between; align-items:center; font-size:11.5px; color:#8a8983; border-top:1px solid #E5E2D9; padding-top:12px;}
  .status-pill{
    font-family:'Inter',sans-serif; font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; border:none; cursor:pointer;
    appearance:none; -webkit-appearance:none;
  }
  .status-Open{background:var(--ink); color:#fff;}
  .status-In-Progress{background:var(--amber); color:#1C1E21;}
  .status-Resolved{background:var(--green); color:#fff;}

  .corner-stamp{
    position:absolute; top:14px; right:-30px; width:110px; text-align:center;
    font-family:'JetBrains Mono',monospace; font-size:9.5px; font-weight:700; letter-spacing:0.05em;
    padding:3px 0; transform:rotate(40deg); text-transform:uppercase;
  }
  .corner-stamp.crit{background:var(--red); color:#fff;}

  .empty-state{
    text-align:center; padding:70px 20px; color:var(--text-dim);
  }
  .empty-state .glyph{font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--amber); margin-bottom:10px; display:block;}
  .empty-state p{font-size:14px;}

  @media (max-width:640px){
    .row2{grid-template-columns:1fr;}
    .severity-picker{grid-template-columns:repeat(2,1fr);}
    .card{padding:24px;}
    .topbar{flex-direction:column; align-items:flex-start;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <span class="brand-mark">◆ BUGS</span>
      <h1>Field Reports</h1>
    </div>
    <div class="nav-tabs">
      <button class="nav-tab active" data-view="form">Submit</button>
      <button class="nav-tab" data-view="board">Review Board</button>
    </div>
  </div>

  <!-- ============ FORM VIEW ============ -->
  <div class="view active" id="view-form">
    <div class="form-wrap">
      <div class="form-intro">
        <span class="eyebrow">Log a specimen</span>
        <h2>Found something broken?</h2>
        <p>Tell us exactly what happened and how to see it again. The more precise the report, the faster it gets fixed.</p>
      </div>

      <form class="card" id="bugForm">
        <div class="field">
          <label for="reporter">Your name or email</label>
          <input type="text" id="reporter" placeholder="jane@company.com" required>
        </div>

        <div class="field">
          <label for="summary">Summary</label>
          <input type="text" id="summary" placeholder="Login button unresponsive on mobile" required>
        </div>

        <div class="field">
          <label for="description">What went wrong</label>
          <textarea id="description" placeholder="Describe what happened in your own words." required></textarea>
        </div>

        <div class="field">
          <label for="steps">Steps to reproduce</label>
          <textarea id="steps" placeholder="1. Open the app&#10;2. Tap Log In&#10;3. Nothing happens" required></textarea>
          <span class="hint">Numbered steps help us see the bug ourselves.</span>
        </div>

        <div class="row2">
          <div class="field">
            <label for="expected">Expected result</label>
            <textarea id="expected" placeholder="What should have happened"></textarea>
          </div>
          <div class="field">
            <label for="actual">Actual result</label>
            <textarea id="actual" placeholder="What actually happened"></textarea>
          </div>
        </div>

        <div class="field">
          <label>Severity</label>
          <div class="severity-picker" id="sevPicker">
            <button type="button" class="sev-btn" data-sev="Low">Low</button>
            <button type="button" class="sev-btn" data-sev="Medium">Medium</button>
            <button type="button" class="sev-btn" data-sev="High">High</button>
            <button type="button" class="sev-btn" data-sev="Critical">Critical</button>
          </div>
        </div>

        <div class="row2">
          <div class="field">
            <label for="area">Area / feature</label>
            <input type="text" id="area" placeholder="Checkout, Login, Search…">
          </div>
          <div class="field">
            <label for="device">Browser / device</label>
            <input type="text" id="device" placeholder="Chrome 126 / Windows 11">
          </div>
        </div>

        <div class="field">
          <label for="link">Screenshot or recording link <span class="hint" style="display:inline; text-transform:none; font-weight:400;">(optional)</span></label>
          <input type="text" id="link" placeholder="https://…">
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Submit report</button>
      </form>
    </div>
  </div>

  <!-- ============ SUCCESS (swapped in place of form) ============ -->

  <!-- ============ BOARD VIEW ============ -->
  <div class="view" id="view-board">
    <div class="board-header">
      <h2>Review Board</h2>
      <div class="board-stats" id="boardStats"></div>
    </div>
    <div class="filter-row" id="filterRow">
      <button class="filter-chip active" data-filter="All">All</button>
      <button class="filter-chip" data-filter="Open">Open</button>
      <button class="filter-chip" data-filter="In Progress">In Progress</button>
      <button class="filter-chip" data-filter="Resolved">Resolved</button>
    </div>
    <div class="board-grid" id="boardGrid"></div>
  </div>
</div>

<script>
const STORE_KEY = 'bugs:list';
let bugs = [];
let currentFilter = 'All';
let selectedSeverity = 'Medium';

// ---------- storage helpers ----------
async function loadBugs(){
  try{
    const res = await window.storage.get(STORE_KEY, true);
    bugs = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    bugs = [];
  }
}
async function saveBugs(){
  try{
    await window.storage.set(STORE_KEY, JSON.stringify(bugs), true);
  }catch(e){
    console.error('Storage error', e);
  }
}

// ---------- nav ----------
document.querySelectorAll('.nav-tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-' + tab.dataset.view).classList.add('active');
    if(tab.dataset.view === 'board') renderBoard();
  });
});

// ---------- severity picker ----------
document.querySelectorAll('.sev-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.sev-btn').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedSeverity = btn.dataset.sev;
  });
});
document.querySelector('.sev-btn[data-sev="Medium"]').classList.add('selected');

// ---------- form submit ----------
const form = document.getElementById('bugForm');
const formWrap = document.querySelector('.form-wrap');
form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Submitting…';

  const id = 'BUG-' + String(Date.now()).slice(-6);
  const bug = {
    id,
    reporter: document.getElementById('reporter').value.trim(),
    summary: document.getElementById('summary').value.trim(),
    description: document.getElementById('description').value.trim(),
    steps: document.getElementById('steps').value.trim(),
    expected: document.getElementById('expected').value.trim(),
    actual: document.getElementById('actual').value.trim(),
    severity: selectedSeverity,
    area: document.getElementById('area').value.trim(),
    device: document.getElementById('device').value.trim(),
    link: document.getElementById('link').value.trim(),
    status: 'Open',
    date: new Date().toISOString()
  };

  await loadBugs();
  bugs.unshift(bug);
  await saveBugs();

  formWrap.innerHTML = `
    <div class="success-card">
      <span class="success-stamp">${id} · LOGGED</span>
      <h3>Report received</h3>
      <p>Thanks — this has been added to the review board. We'll take it from here.</p>
      <button id="newReportBtn">Submit another</button>
    </div>
  `;
  document.getElementById('newReportBtn').addEventListener('click', ()=>{ location.reload(); });
});

// ---------- board ----------
document.querySelectorAll('.filter-chip').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    currentFilter = chip.dataset.filter;
    renderBoard();
  });
});

function timeAgo(iso){
  const diff = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diff/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs + 'h ago';
  return Math.floor(hrs/24) + 'd ago';
}

async function cycleStatus(id){
  await loadBugs();
  const bug = bugs.find(b=>b.id===id);
  if(!bug) return;
  const order = ['Open','In Progress','Resolved'];
  const next = order[(order.indexOf(bug.status)+1) % order.length];
  bug.status = next;
  await saveBugs();
  renderBoard();
}
window.cycleStatus = cycleStatus;

async function renderBoard(){
  await loadBugs();
  const grid = document.getElementById('boardGrid');
  const statsEl = document.getElementById('boardStats');

  const counts = {Open:0, 'In Progress':0, Resolved:0};
  bugs.forEach(b=>{ if(counts[b.status] !== undefined) counts[b.status]++; });
  statsEl.innerHTML = `
    <span class="stat-chip"><b>${bugs.length}</b> total</span>
    <span class="stat-chip"><b>${counts.Open}</b> open</span>
    <span class="stat-chip"><b>${counts['In Progress']}</b> in progress</span>
    <span class="stat-chip"><b>${counts.Resolved}</b> resolved</span>
  `;

  const filtered = currentFilter === 'All' ? bugs : bugs.filter(b=>b.status===currentFilter);

  if(filtered.length === 0){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
      <span class="glyph">⌁ NO SPECIMENS</span>
      <p>${bugs.length === 0 ? 'No bugs reported yet.' : 'Nothing matches this filter.'}</p>
    </div>`;
    return;
  }

  grid.innerHTML = filtered.map(b=>{
    const statusClass = 'status-' + b.status.replace(' ','-');
    const critStamp = b.severity === 'Critical' ? '<div class="corner-stamp crit">Critical</div>' : '';
    return `
      <div class="ticket">
        ${critStamp}
        <span class="ticket-id">${b.id} · ${timeAgo(b.date)}</span>
        <h4>${escapeHtml(b.summary || 'Untitled')}</h4>
        <div class="desc">${escapeHtml(b.description || 'No description provided.')}</div>
        <div class="ticket-tags">
          <span class="tag tag-sev-${b.severity}">${b.severity}</span>
          ${b.area ? `<span class="tag tag-area">${escapeHtml(b.area)}</span>` : ''}
        </div>
        <div class="ticket-footer">
          <span>${escapeHtml(b.reporter || 'anonymous')}</span>
          <button class="status-pill ${statusClass}" onclick="cycleStatus('${b.id}')">${b.status}</button>
        </div>
      </div>
    `;
  }).join('');
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

renderBoard();
</script>
</body>
</html>
